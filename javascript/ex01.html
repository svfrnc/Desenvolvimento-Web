<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="cursos"></ul>
    <button id="btn"name="clickbotao">Clique aqui</button>
    <script>
       const cursos=["django", "java", "C++"];
       const lista=document.getElementById("cursos");
        
        for (let i=0;i<cursos.length;i++){
            let item=document.createElement("li");
            item.innerText=cursos[i];
            lista.appendChild(item);
       }
    </script>
    <script>
        document.getElementById("btn").addEventListener("click", clickbotao);
    </script>
</body>
</html>
